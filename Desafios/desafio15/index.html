<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de grid</title>
    <style>
        main {
            display: grid;
            max-width: 1000px;
            margin: 0 auto;
            border: 1px solid gray;
            grid-template: repeat(8, 50px) / repeat(4, 1fr);
        }

        main > div {
            text-align: center;
            text-transform: uppercase;
            display: grid;
            align-items: center;
        }

        .topo {
            background-color: lightblue;
            grid-area: 1 / 1 / 3 / -1;
        }

        .menu {
            background-color: lightcoral;
            grid-area: 3 / 1 / 3/ -1;
        }

        .principal {
            background-color: lightgoldenrodyellow;
            grid-area: 4 / 1 / -2 / -2;
        }

        .secundario {
            background-color: lightgreen;
            grid-area: 4 / 4 / -2 / -1;
        }

        .rodape {
            background-color: lightpink;
            grid-area: -2 / 1 / -1 / -1;
        }
    </style>
</head>
<body>
    <main>
        <div class="topo">topo</div>
        <div class="menu">menu</div>
        <div class="principal">principal</div>
        <div class="secundario">secundario</div>
        <div class="rodape">rodape</div>
    </main>
</body>
</html>
