<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
        /* Declarações gerais */
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color:  #233eff;
        }

        h1 {
            color: white;
            text-shadow: 3px 3px 0 #182aaf;
        }

        /* Declarações retrato */
        @media screen and (orientation:portrait) {
            body {
                background: url('../imagens/cev-portrait.jpg') no-repeat center bottom fixed;
                background-size: contain;
            }
        }

        /* Declarações paisagem */
         @media screen and (orientation:landscape) {
            body {
                background: url('../imagens/cev-landscape.jpg') no-repeat left bottom fixed;
                background-size: contain;
            }
        }

    </style>
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>

</body>
</html>
