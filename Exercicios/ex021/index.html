<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
            background-color: rgba(128, 128, 128, 0.493);

            border: 5px solid black;
            padding: 10px;
            outline: 15px outset aqua;
            margin: 100px;
        }

        h1:hover {
            background-color: skyblue;
            outline: none;
        }

        p {
            text-align: center;
        }

        a {
            border: 5px solid red;
        }
    </style>
</head>
<body>

    <h1>Exemplo de Caixa Box Level</h1>
    <p>Parágrafo são exemplo de box level, mas links também são exemplos de <a href="#">inline level</a></p>
</body>
</html>
